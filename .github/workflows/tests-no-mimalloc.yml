name: C++ Tests CI (No mimalloc)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install Ninja
      run: choco install ninja
      
    - name: Configure CMake
      run: cmake -B tests/build -S tests -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DENABLE_MIMALLOC=OFF
      
    - name: Build
      run: cmake --build tests/build --config Release

    - name: Run Tests
      working-directory: tests/build
      run: ctest -C Release --output-on-failure

  build-and-test-unix:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/tests/build -S ${{github.workspace}}/tests -DCMAKE_BUILD_TYPE=Release -DENABLE_MIMALLOC=OFF

    - name: Build
      run: cmake --build ${{github.workspace}}/tests/build --config Release

    - name: Run Tests
      working-directory: ${{github.workspace}}/tests/build
      run: ctest -C Release --output-on-failure

  build-and-test-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/tests/build -S ${{github.workspace}}/tests -DCMAKE_BUILD_TYPE=Release -DENABLE_MIMALLOC=OFF

    - name: Build
      run: cmake --build ${{github.workspace}}/tests/build --config Release

    - name: Run Tests
      working-directory: ${{github.workspace}}/tests/build
      run: ctest -C Release --output-on-failure
