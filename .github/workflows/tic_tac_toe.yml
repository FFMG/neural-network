name: Tic-Tac-Toe RL CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-run-tic-tac-toe:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install pybind11 dependency
      run: |
        python -m pip install --upgrade pip
        pip install pybind11

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Python Binding Module
      run: msbuild python/neuralnetwork_py.sln /p:Configuration=Release /p:Platform=x64
      env:
        PYTHON_HOME: ${{ env.pythonLocation }}

    - name: Run Tic-Tac-Toe Reinforcement Learning Example
      run: python python/examples/tic_tac_toe.py
      env:
        TIC_TAC_TOE_EPISODES: "800"
